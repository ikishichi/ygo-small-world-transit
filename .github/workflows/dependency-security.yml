name: Dependency security

on:
  schedule:
    - cron: '17 19 * * 5' # 土曜04:17 JST（金曜19:17 UTC）
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Configure scan paths
        run: |
          echo "SCAN_INPUT=$RUNNER_TEMP/dependency-security/input" >> "$GITHUB_ENV"
          echo "SCAN_REPORT_DIR=$RUNNER_TEMP/dependency-security/report" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=$RUNNER_TEMP/trivy-cache" >> "$GITHUB_ENV"
      - name: Prepare scan input
        run: |
          test -s requirements.txt
          test -f .trivyignore
          mkdir -p "$SCAN_INPUT" "$SCAN_REPORT_DIR"
          cp requirements.txt "$SCAN_INPUT/requirements.txt"
          cp requirements.txt "$SCAN_REPORT_DIR/requirements.txt"
          cp .trivyignore "$SCAN_REPORT_DIR/trivyignore.txt"
      - name: Install Trivy
        shell: bash
        env:
          # バージョンを更新するときは公式リリースのSHA-256も更新する。
          TRIVY_VERSION: "0.76.1"
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          install_dir="$(mktemp -d "$RUNNER_TEMP/trivy.XXXXXX")"
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          cd "$install_dir"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" trivy
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Scan locked dependencies
        id: scan
        working-directory: ${{ runner.temp }}
        run: |
          trivy fs --scanners vuln --pkg-types library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false --ignorefile /dev/null \
            --list-all-pkgs --format json --exit-code 0 \
            --output "$SCAN_REPORT_DIR/trivy.json" "$SCAN_INPUT"
      - name: Apply vulnerability exceptions
        id: filter
        working-directory: ${{ runner.temp }}
        run: |
          trivy convert --scanners vuln --format json --list-all-pkgs \
            --ignorefile "$SCAN_REPORT_DIR/trivyignore.txt" --exit-code 0 \
            --output "$SCAN_REPORT_DIR/trivy-filtered.json" "$SCAN_REPORT_DIR/trivy.json"
      - name: Validate report and write summary
        if: ${{ always() && !cancelled() }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
        run: |
          mkdir -p "$SCAN_REPORT_DIR"
          summary_status=0
          python scripts/dependency_security_report.py \
            --report "$SCAN_REPORT_DIR/trivy.json" \
            --filtered-report "$SCAN_REPORT_DIR/trivy-filtered.json" \
            --ignorefile "$SCAN_REPORT_DIR/trivyignore.txt" \
            --requirements requirements.txt \
            --scan-outcome "$SCAN_OUTCOME" \
            --filter-outcome "$FILTER_OUTCOME" \
            --summary "$SCAN_REPORT_DIR/summary.md" || summary_status=$?
          cat "$SCAN_REPORT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$summary_status"
      - name: Block High and Critical vulnerabilities
        working-directory: ${{ runner.temp }}
        run: |
          trivy convert --scanners vuln --format table \
            --severity HIGH,CRITICAL --ignorefile /dev/null \
            --exit-code 1 "$SCAN_REPORT_DIR/trivy-filtered.json"
      - name: Upload scan report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dependency-security-report
          path: |
            ${{ env.SCAN_REPORT_DIR }}/trivy.json
            ${{ env.SCAN_REPORT_DIR }}/trivy-filtered.json
            ${{ env.SCAN_REPORT_DIR }}/trivyignore.txt
            ${{ env.SCAN_REPORT_DIR }}/summary.md
            ${{ env.SCAN_REPORT_DIR }}/requirements.txt
          if-no-files-found: warn
          retention-days: 14
